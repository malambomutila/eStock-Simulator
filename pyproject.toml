[project]
name = "estock-simulator"
version = "0.1.0"
description = "AI-driven healthcare stock management simulator with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "gradio>=4.36",
    "pandas>=2.2",
    "uvicorn>=0.30",
    "fastapi>=0.111",
    "websockets>=12.0",
    "python-dateutil>=2.9",
    "rich>=13.7",
]

[project.scripts]
estock = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "api", "dashboard", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
